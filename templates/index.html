<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Taskflow</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="app-shell">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-icon">
                    ✓
                </div>

                <div class="brand-info">
                    <div class="brand-name">
                        Taskflow
                    </div>

                    <div class="brand-subtitle">
                        Personal workspace
                    </div>
                </div>

            </div>


            <nav class="sidebar-nav">

                <button
                    class="nav-item active"
                    id="tasks-nav"
                    data-page="tasks"
                >
                    <span class="nav-icon">
                        ✓
                    </span>

                    <span>
                        Tasks
                    </span>
                </button>


                <button
                    class="nav-item"
                    id="overview-nav"
                    data-page="overview"
                >
                    <span class="nav-icon">
                        ▥
                    </span>

                    <span>
                        Overview
                    </span>
                </button>

            </nav>


            <div class="sidebar-footer">

                <div class="workspace-status">

                    <span class="status-dot"></span>

                    <span>
                        Workspace active
                    </span>

                </div>

            </div>

        </aside>


        <!-- ================= MAIN ================= -->

        <main class="main">

            <header class="mobile-header">

                <div class="mobile-brand">
                    Taskflow
                </div>

                <button
                    class="mobile-menu-button"
                    id="mobile-menu-button"
                >
                    ☰
                </button>

            </header>


            <div
                class="content"
                id="main-content"
            >

                <!-- JavaScript renders content here -->

            </div>

        </main>

    </div>


    <!-- ================= TOAST ================= -->

    <div
        class="toast-container"
        id="toast-container"
    ></div>


    <!-- ================= MODAL ================= -->

    <div
        class="modal-overlay hidden"
        id="modal-overlay"
    >

        <div
            class="modal"
            id="modal"
        >

            <button
                class="modal-close"
                id="modal-close"
                aria-label="Close"
            >
                ×
            </button>

            <div id="modal-content"></div>

        </div>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
